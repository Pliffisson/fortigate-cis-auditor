services:
  auditor:
    build: .
    image: fortigate-cis-auditor:local
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:-proxy}"
      traefik.http.routers.fortigate-auditor.rule: "Host(`${AUDITOR_DOMAIN:-auditoria-fortinet.enw.internal}`)"
      traefik.http.routers.fortigate-auditor.entrypoints: "websecure"
      traefik.http.routers.fortigate-auditor.tls: "true"
      traefik.http.routers.fortigate-auditor.service: "fortigate-auditor"
      traefik.http.routers.fortigate-auditor.middlewares: "secure-headers@file,compress@file,fortigate-auditor-rate@docker"
      traefik.http.services.fortigate-auditor.loadbalancer.server.port: "8000"
      traefik.http.middlewares.fortigate-auditor-rate.ratelimit.average: "120"
      traefik.http.middlewares.fortigate-auditor-rate.ratelimit.period: "1m"
      traefik.http.middlewares.fortigate-auditor-rate.ratelimit.burst: "20"
    environment:
      TZ: "${TZ:-America/Manaus}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-10}"
      AUTH_USER: "${AUTH_USER:-}"
      AUTH_PASSWORD_HASH: "${AUTH_PASSWORD_HASH:-}"
      REQUESTS_PER_MINUTE: "${REQUESTS_PER_MINUTE:-0}"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0

  tests:
    profiles: [test]
    environment:
      TZ: "${TZ:-America/Manaus}"
    build:
      context: .
      target: tests
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2.0

  browser:
    profiles: [browser]
    environment:
      TZ: "${TZ:-America/Manaus}"
    build:
      context: .
      target: browser
    read_only: true
    volumes:
      - ./web:/app/web:ro
      - ./cis_benchmark:/app/cis_benchmark:ro
      - ./tests:/app/tests:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    mem_limit: 1g

networks:
  proxy:
    external: true
    name: "${TRAEFIK_NETWORK:-proxy}"
